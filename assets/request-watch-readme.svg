<g class="detail d5"><text x="795" y="405" class="govhead">CTRL-500 · Provider Route Control</text><text x="795" y="444" class="govcopy">CAPABILITY · DATA BOUNDARY</text><text x="795" y="485" class="sub">What is governed lights with the active station.</text></g>
