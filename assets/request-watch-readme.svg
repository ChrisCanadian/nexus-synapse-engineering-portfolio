<text x="795" y="535" class="sub">Control family shown ≠ runtime revision-binding proof · governance card is station-specific.</text><rect x="50" y="598" width="1100" height="38" rx="8" fill="#0c1b28" stroke="#203d4e"/><text x="75" y="622" class="sub">CLICK FOR THE LIVE v0.6 REQUEST WATCH · governance is distributed through real gates, not one central box</text></svg>