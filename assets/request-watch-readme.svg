<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Nexus Request Watch</title>
<desc id="desc">Animated public-safe overview of a request moving through eight Nexus runtime stations.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#091824"/><stop offset="1" stop-color="#06111b"/></linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    text{font-family:Arial,Helvetica,sans-serif}.title{font-size:29px;font-weight:800;fill:#f3f7fa;letter-spacing:1px}.sub{font-size:14px;fill:#9cb0bd}.station-label{font-size:11px;font-weight:700;fill:#a9bbc5;text-anchor:middle}.num{font-size:10px;font-weight:800;fill:#45d9e8;text-anchor:middle}.panel-title{font-size:15px;font-weight:800;fill:#45d9e8;letter-spacing:.8px}.panel-head{font-size:24px;font-weight:800;fill:#f3f7fa}.panel-copy{font-size:16px;fill:#c4d2d9}.tiny{font-size:11px;fill:#8198a5}.stage rect{fill:#0c1b28;stroke:#35586a;stroke-width:2}.stage circle{fill:#102333;stroke:#45d9e8;stroke-width:2}.stage{animation:pulse 20.8s linear infinite}.s1{animation-delay:0s}.s2{animation-delay:2.6s}.s3{animation-delay:5.2s}.s4{animation-delay:7.8s}.s5{animation-delay:10.4s}.s6{animation-delay:13s}.s7{animation-delay:15.6s}.s8{animation-delay:18.2s}@keyframes pulse{0%,10%{filter:url(#glow)}0%,10% rect{stroke:#45d9e8;fill:#0d2d37}12%,100%{filter:none}}
    .detail{opacity:0;animation:detail 20.8s linear infinite}.d1{animation-delay:0s}.d2{animation-delay:2.6s}.d3{animation-delay:5.2s}.d4{animation-delay:7.8s}.d5{animation-delay:10.4s}.d6{animation-delay:13s}.d7{animation-delay:15.6s}.d8{animation-delay:18.2s}@keyframes detail{0%,10%{opacity:1}12%,100%{opacity:0}}
    .lamp{fill:#18313e;stroke:#35586a;stroke-width:1.3}.lamp.active{animation:lamp 20.8s linear infinite}@keyframes lamp{0%,10%{fill:#45d9e8;stroke:#74edf4}12%,100%{fill:#18313e;stroke:#35586a}}
  </style>
</defs>
<rect width="1200" height="675" rx="18" fill="url(#bg)"/>
<rect x="20" y="20" width="1160" height="635" rx="14" fill="none" stroke="#1d3b4d" stroke-width="1.5"/>
<text x="50" y="70" class="title">NEXUS SYNAPSE — REQUEST WATCH</text>
<text x="50" y="98" class="sub">Public-safe runtime journey · illustrative animation · not live takt telemetry</text>
<text x="1148" y="70" class="sub" text-anchor="end">v0.4.1</text>

<path d="M102 225 H1098" fill="none" stroke="#29495b" stroke-width="8" stroke-linecap="round"/>
<path d="M102 225 H1098" fill="none" stroke="#20a9b8" stroke-width="2" stroke-linecap="round" opacity=".7"/>

<g class="stage s1" transform="translate(102 225)"><circle r="25"/><rect x="-52" y="42" width="104" height="44" rx="8"/><text y="4" class="num">01</text><text y="61" class="station-label">REQUEST</text><text y="76" class="station-label">INTAKE</text></g>
<g class="stage s2" transform="translate(244 225)"><circle r="25"/><rect x="-52" y="42" width="104" height="44" rx="8"/><text y="4" class="num">02</text><text y="61" class="station-label">ANALYSIS</text><text y="76" class="station-label">INSPECTION</text></g>
<g class="stage s3" transform="translate(386 225)"><circle r="25"/><rect x="-52" y="42" width="104" height="44" rx="8"/><text y="4" class="num">03</text><text y="61" class="station-label">STATE</text><text y="76" class="station-label">KITTING</text></g>
<g class="stage s4" transform="translate(528 225)"><circle r="25"/><rect x="-52" y="42" width="104" height="44" rx="8"/><text y="4" class="num">04</text><text y="68" class="station-label">SSR</text></g>
<g class="stage s5" transform="translate(670 225)"><circle r="25"/><rect x="-52" y="42" width="104" height="44" rx="8"/><text y="4" class="num">05</text><text y="61" class="station-label">MODEL</text><text y="76" class="station-label">INFERENCE</text></g>
<g class="stage s6" transform="translate(812 225)"><circle r="25"/><rect x="-52" y="42" width="104" height="44" rx="8"/><text y="4" class="num">06</text><text y="61" class="station-label">TOOL</text><text y="76" class="station-label">PROOF</text></g>
<g class="stage s7" transform="translate(954 225)"><circle r="25"/><rect x="-52" y="42" width="104" height="44" rx="8"/><text y="4" class="num">07</text><text y="61" class="station-label">FINAL</text><text y="76" class="station-label">INSPECTION</text></g>
<g class="stage s8" transform="translate(1096 225)"><circle r="25"/><rect x="-52" y="42" width="104" height="44" rx="8"/><text y="4" class="num">08</text><text y="61" class="station-label">CONTINUITY</text><text y="76" class="station-label">UPDATE</text></g>

<circle r="9" fill="#f3f7fa" stroke="#45d9e8" stroke-width="4" filter="url(#glow)"><animateMotion dur="20.8s" repeatCount="indefinite" path="M102 225 H1096" calcMode="linear"/></circle>

<rect x="50" y="345" width="1100" height="205" rx="14" fill="#0b1a26" stroke="#29495b" stroke-width="1.5"/>
<text x="78" y="378" class="panel-title">ACTIVE STATION</text>
<g class="detail d1"><text x="78" y="420" class="panel-head">Request Intake</text><text x="78" y="454" class="panel-copy">Resolve the surface request, trusted actor and scope, then create the immutable turn identity.</text></g>
<g class="detail d2"><text x="78" y="420" class="panel-head">Analysis / Inspection</text><text x="78" y="454" class="panel-copy">Produce advisory NLP, focus and salience signals without allowing analysis to become canonical authority.</text></g>
<g class="detail d3"><text x="78" y="420" class="panel-head">Authorized Context Kitting</text><text x="78" y="454" class="panel-copy">Acquire identity, memory, continuity, modes, goals and the authorized tool view in parallel.</text></g>
<g class="detail d4"><text x="78" y="420" class="panel-head">Structured State Reconstruction</text><text x="78" y="454" class="panel-copy">Compose the bounded operating context deterministically with eligibility, budget and provenance controls.</text></g>
<g class="detail d5"><text x="78" y="420" class="panel-head">Forklift / Inference Dispatch</text><text x="78" y="454" class="panel-copy">Route the staged operating context through the selected interchangeable provider / model inference path.</text></g>
<g class="detail d6"><text x="78" y="420" class="panel-head">Tool Workcell / Proof</text><text x="78" y="454" class="panel-copy">Validate, authorize and execute typed capabilities; observe results and retain tool or artifact receipts.</text></g>
<g class="detail d7"><text x="78" y="420" class="panel-head">Final Inspection</text><text x="78" y="454" class="panel-copy">Check draft claims against available receipts and policy; perform only bounded correction / reinspection.</text></g>
<g class="detail d8"><text x="78" y="420" class="panel-head">Transaction Close / Continuity</text><text x="78" y="454" class="panel-copy">Persist the turn and receipts, release asynchronous work, and make eligible governed state available later.</text></g>

<text x="78" y="515" class="tiny">RESPONSIBILITY STATUS</text>
<g transform="translate(270 505)"><circle class="lamp active" r="7" style="animation-delay:0s"/><circle class="lamp active" cx="28" r="7" style="animation-delay:2.6s"/><circle class="lamp active" cx="56" r="7" style="animation-delay:5.2s"/><circle class="lamp active" cx="84" r="7" style="animation-delay:7.8s"/><circle class="lamp active" cx="112" r="7" style="animation-delay:10.4s"/><circle class="lamp active" cx="140" r="7" style="animation-delay:13s"/><circle class="lamp active" cx="168" r="7" style="animation-delay:15.6s"/><circle class="lamp active" cx="196" r="7" style="animation-delay:18.2s"/></g>

<rect x="50" y="580" width="1100" height="42" rx="8" fill="#0c1b28" stroke="#203d4e"/>
<text x="75" y="606" class="sub">WATCH THE REQUEST MOVE THROUGH THE RUNTIME · CLICK FOR THE FULL PLAYBACK / PROCESS ARCHITECTURE</text>
</svg>