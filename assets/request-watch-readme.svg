<g class="detail d1"><text x="795" y="405" class="govhead">CTRL-100 · Trust / Scope Release</text><text x="795" y="444" class="govcopy">AUTH · SCOPE</text><text x="795" y="485" class="sub">What is governed lights with the active station.</text></g>
<g class="detail d2"><text x="795" y="405" class="govhead">CTRL-200 · Analysis Quality</text><text x="795" y="444" class="govcopy">QUALITY · FALLBACK · PROVENANCE</text><text x="795" y="485" class="sub">What is governed lights with the active station.</text></g>
