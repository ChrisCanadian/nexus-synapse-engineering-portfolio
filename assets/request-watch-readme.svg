<g class="detail d7"><text x="795" y="405" class="govhead">CTRL-700 · Response Release</text><text x="795" y="444" class="govcopy">QUALITY · RELEASE · REWORK</text><text x="795" y="485" class="sub">What is governed lights with the active station.</text></g>
