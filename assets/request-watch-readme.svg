<rect x="50" y="326" width="690" height="245" rx="14" fill="#0b1a26" stroke="#29495b"/><text x="78" y="360" class="kicker">ACTIVE STATION</text>
<g class="detail d1"><text x="78" y="405" class="head">Receiving</text><text x="78" y="440" class="copy">Authenticate actor/scope; only trusted scope enters the governed turn.</text></g>
<g class="detail d2"><text x="78" y="405" class="head">Analysis</text><text x="78" y="440" class="copy">Produce confidence-labeled advisory state; degrade rather than manufacture fact.</text></g>
<g class="detail d3"><text x="78" y="405" class="head">Context Kitting</text><text x="78" y="440" class="copy">Release only eligible, current, in-scope identity/memory/tools/work state.</text></g>
<g class="detail d4"><text x="78" y="405" class="head">SSR</text><text x="78" y="440" class="copy">Release required/eligible context within protected budget and provenance controls.</text></g>
<g class="detail d5"><text x="78" y="405" class="head">Forklift</text><text x="78" y="440" class="copy">Choose only a capability/data-boundary-compatible provider route.</text></g>
<g class="detail d6"><text x="78" y="405" class="head">Tool / Proof</text><text x="78" y="440" class="copy">Authorize typed execution and require observed proof before success claims.</text></g>
<g class="detail d7"><text x="78" y="405" class="head">Final Inspection</text><text x="78" y="440" class="copy">Release only after evidence-aware checks or bounded rework/failure.</text></g>
<g class="detail d8"><text x="78" y="405" class="head">Transaction Close</text><text x="78" y="440" class="copy">Commit durably; async WIP uses lease/retry/idempotency and candidate boundaries.</text></g>
