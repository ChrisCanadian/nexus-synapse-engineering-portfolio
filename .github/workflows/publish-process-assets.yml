name: Publish Process Assets

on:
  push:
    branches: [main]
    paths:
      - "process-architecture/diagrams/source/**"
      - "scripts/materialize_process_assets.py"
      - "scripts/reconcile_process_release.py"
      - ".github/workflows/publish-process-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-process-assets
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out controlled source
        uses: actions/checkout@v4
        with:
          path: source

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Materialize and verify release representations
        run: python source/scripts/materialize_process_assets.py --out "$RUNNER_TEMP/process-assets"

      - name: Reconcile current-summary document pointers
        run: python source/scripts/reconcile_process_release.py --root source

      - name: Commit current-summary reconciliation
        working-directory: source
        shell: bash
        run: |
          if git diff --quiet -- README.md docs/PROCESS_ARCHITECTURE.md docs/NEXUS_OVERVIEW.md docs/NEXUS_VISUAL_GALLERY.md docs/REPOSITORY_MAP.md process-architecture/README.md; then
            echo "Current-summary process pointers are already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md docs/PROCESS_ARCHITECTURE.md docs/NEXUS_OVERVIEW.md docs/NEXUS_VISUAL_GALLERY.md docs/REPOSITORY_MAP.md process-architecture/README.md
            git commit -m "Reconcile public process pointers to Master Process Map v0.7"
            git push origin HEAD:main
          fi

      - name: Check out GitHub Pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages

      - name: Install generated assets into Pages
        run: |
          cp "$RUNNER_TEMP/process-assets/master-process-map-v0.7.svg" pages/master-process-map-v0.7.svg
          cp "$RUNNER_TEMP/process-assets/master-process-map-v0.7.html" pages/master-process-map-v0.7.html

      - name: Commit generated release representations
        working-directory: pages
        shell: bash
        run: |
          if git diff --quiet -- master-process-map-v0.7.svg master-process-map-v0.7.html; then
            echo "Generated process assets are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add master-process-map-v0.7.svg master-process-map-v0.7.html
          git commit -m "Publish Master Process Map v0.7"
          git push origin HEAD:gh-pages
